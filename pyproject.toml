[project]
name = "pdftts"
version = "0.2.0"
description = "Turn PDFs, EPUBs and pasted text into audiobooks on your own machine — five interchangeable TTS engines, layout-aware extraction, OCR for scans. Fully offline."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["tts", "pdf", "kokoro", "text-to-speech", "ocr", "audiobook", "accessibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing",
]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ebooklib>=0.20",
    "fastapi>=0.141.1",
    "kokoro>=0.9.4",
    "lxml>=6.1.2",
    "pdfplumber>=0.11.10",
    "pypdf>=6.16.2",
    "python-multipart>=0.0.32",
    "segno>=1.6.6",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
pdftts = "pdftts.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Small, fast voices for weak hardware (Raspberry Pi, old laptops, headless boxes).
piper = ["piper-tts>=1.7.0"]
# Highest quality plus voice cloning. Needs real hardware and runs slower than
# realtime; setuptools is pinned because chatterbox's watermarker imports
# pkg_resources, which setuptools 81+ removed.
chatterbox = ["chatterbox-tts>=0.1.7", "resemble-perth>=1.0.1", "setuptools<81"]
# Japanese and Mandarin need their own grapheme-to-phoneme backends. Japanese
# additionally wants a dictionary that is too big to vendor: after installing,
# run `uv run python -m unidic download` once (526 MB).
# MOBI/AZW3. Pure Python (vendored KindleUnpack) — no Calibre, no external tools.
kindle = ["mobi>=0.3.3"]
ja = ["misaki[ja]>=0.9.4"]
zh = ["misaki[zh]>=0.9.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdftts"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "pdftts/web"
"vendor" = "pdftts/vendor"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
